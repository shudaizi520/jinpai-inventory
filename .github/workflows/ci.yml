name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
          coverage: none
      - name: PHP syntax
        run: find php tests scripts -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: php tests/run.php
      - name: Integration tests
        env:
          TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;charset=utf8mb4
          TEST_DB_USER: root
          TEST_DB_PASSWORD: test-root-password
        run: php tests/run.php tests/integration/migration_test.php tests/integration/initial_setup_test.php tests/integration/invitation_test.php tests/integration/csrf_test.php tests/integration/tenant_isolation_test.php tests/integration/admin_settings_test.php tests/integration/api_endpoint_test.php tests/integration/session_revocation_test.php tests/integration/inventory_concurrency_test.php tests/integration/audit_recovery_test.php
      - name: Packaging and release checks
        run: |
          sh tests/docker/compose_test.sh
          sh tests/release/release_test.sh
          sh tests/release/maintenance_scripts_test.sh
      - name: Compose validation
        env:
          DB_PASSWORD: test-database-password
          MYSQL_ROOT_PASSWORD: test-root-password
        run: |
          docker compose config >/dev/null
          docker compose -f compose.truenas.example.yaml config >/dev/null
          docker compose -f compose.yaml -f compose.build.yaml config >/dev/null
      - name: Docker build
        run: docker build --tag inventory-app:test .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/shudaizi520/jinpai-inventory
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
