ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes
    AllowOverride None
    Require all granted
</Directory>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<FilesMatch "\.(?:env|ini|log|sql|sqlite|bak)$">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "same-origin"
